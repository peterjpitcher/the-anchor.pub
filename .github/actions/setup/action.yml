name: Set up Node and dependencies
description: >
  Node at the version in .nvmrc, with node_modules restored from the cache.
  Dependencies are installed once per lockfile, not once per job: every job in a
  run after the first restores the same folder in a few seconds.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
