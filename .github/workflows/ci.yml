name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast guardrails — must pass on every PR. These are the regressions that
  # have shipped before and required GSC remediation (see
  # tasks/gsc-indexing-fix/FINAL-SPEC.md).
  seo-and-lint:
    name: SEO regression + lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO regression tests
        # Guards robots.txt, sitemap.xml, redirect chains, the apex/host
        # flattening map, sitemap event resilience, and event lifecycle
        # decisions. Failure here means an indexability regression — see
        # tasks/gsc-indexing-fix/FINAL-SPEC.md and url-lifecycle-policy.md.
        run: npm test -- --runInBand seo-indexing event-seo-strategy sitemap-events

      - name: Lint
        # The full `npm run lint` also executes `audit:hero`, which currently
        # reports pre-existing CTA/image findings unrelated to the GSC indexing
        # guardrails. Keep CI focused on ESLint until that separate audit debt
        # is fixed.
        run: npm run lint:next

  # The full Jest suite. Previously CI only ran the three SEO-guardrail suites
  # above, so two unrelated suites (TrustBar, ManagementTableBookingForm) rotted
  # for weeks without anyone noticing — 33 failing tests on a clean `main`.
  # Running everything here keeps `npm test` usable as a merge gate.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npm test -- --ci --runInBand

  # Full build verifies that no TypeScript or build-time errors land. Slower,
  # but still well under 10 minutes on a clean repo. Kept as a separate job so
  # SEO + lint failures fail-fast.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # next build runs typecheck implicitly. ANCHOR_API_KEY is not required
        # for the build to succeed; runtime API calls are skipped during static
        # generation when the key is missing.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
